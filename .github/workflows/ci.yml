name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dừng ngay khi một job thất bại -> fail rõ ràng, không che giấu lỗi.
permissions:
  contents: read

jobs:
  validate:
    name: Python validation (unittest + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài dependencies từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Kiểm tra cú pháp Python (compileall)
        run: python -m compileall -q src tests scripts

      - name: Kiểm tra import sanity (không gọi network)
        run: |
          python -c "import src.data_collection"
          python -c "import src.data_quality"
          python -c "import src.cleaning"
          python -c "import src.cleaning_pipeline"
          python -c "import src.inference"
          python -c "import importlib.util, pathlib; spec = importlib.util.spec_from_file_location('mc', 'scripts/validate_inference_montecarlo.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('monte-carlo script OK')"

      # Kiểm chứng Monte Carlo đầy đủ (1.000 lần × 9 kịch bản) là công việc
      # KHOA HỌC có chi phí (~nửa giờ) nên CỐ TÌNH không chạy trong CI. CI chỉ
      # kiểm hợp đồng của engine (TestMonteCarloValidation) với số lần rất nhỏ;
      # kết quả thật được commit ở reports/inference_montecarlo.csv.
      - name: Kiểm tra CSV kiểm chứng Monte Carlo đã commit
        run: |
          python - <<'PY'
          import pathlib, sys
          import pandas as pd

          path = pathlib.Path("reports/inference_montecarlo.csv")
          if not path.exists():
              print("Thiếu reports/inference_montecarlo.csv", file=sys.stderr)
              sys.exit(1)
          frame = pd.read_csv(path)
          assert len(frame) >= 30, f"CSV có {len(frame)} dòng — quá ít"
          assert "scenario" in frame.columns and "test" in frame.columns
          for column in frame.columns:
              if column.startswith("rate_"):
                  # Ô trống = phương pháp **không áp dụng** cho kịch bản đó
                  # (ví dụ cặp mùa hậu định không có đối chứng HAC) → bỏ qua,
                  # chỉ kiểm các tỷ lệ **có** mặt.
                  present = frame[column].dropna()
                  assert present.between(0, 1).all(), f"{column} ngoài [0, 1]"
          print(f"OK  {path} ({len(frame)} dòng, {frame['scenario'].nunique()} kịch bản)")
          PY

      # Chỉ chạy unit test. KHÔNG chạy run_collection_pipeline() vì cần
      # gọi OpenAQ S3 / Open-Meteo / AirNow qua mạng (không deterministic).
      - name: Chạy unit tests
        run: python -m unittest discover tests -v

      - name: Kiểm tra mọi notebook là JSON hợp lệ (không cần execute)
        # Rẻ hơn nhiều so với execute nhưng bắt được lỗi nghiêm trọng nhất từng
        # gặp: 03_transformation_pipeline.ipynb từng có hai chuỗi JSON nối vào
        # nhau khiến Jupyter KHÔNG MỞ ĐƯỢC file — và nó sống sót tới khi bị
        # review thủ công vì `notebook-smoke` chỉ chạy notebook 00.
        run: |
          python - <<'PY'
          import pathlib, sys
          import nbformat

          broken = []
          for path in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              try:
                  nbformat.read(path, as_version=4)
              except Exception as exc:
                  broken.append(f"{path}: {type(exc).__name__}: {exc}")
              else:
                  print(f"OK  {path}")
          if broken:
              print("\nNotebook KHÔNG đọc được:", file=sys.stderr)
              for line in broken:
                  print(f"  {line}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Kiểm tra khoảng trắng thừa trong diff (git diff --check)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA" 2>/dev/null || true
          BASE="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          if [ -n "$BASE" ] && [ "$BASE" != "$(git rev-parse HEAD)" ]; then
            git diff --check "$BASE" HEAD
          else
            echo "Không có commit cha so sánh được (đây là commit gốc hoặc push trực tiếp lên main) -> bỏ qua."
          fi

  notebook-smoke:
    name: Notebook smoke test (00_environment_test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài dependencies từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 00_environment_test.ipynb là deterministic hoàn toàn: chỉ import thư viện,
      # ghi/đọc Parquet tạm trong thư mục tạm, render Matplotlib. Không cần network,
      # không phụ thuộc file trong data/raw/ (data/raw/*.json bị .gitignore loại bỏ).
      #
      # 01_data_collection.ipynb CỐ TÌNH KHÔNG chạy trong CI: nó gọi
      # run_collection_pipeline() -> tải OpenAQ/Open-Meteo/AirNow từ Internet và
      # phụ thuộc dữ liệu thô không được commit. Bắt buộc chạy thủ công local.
      #
      # 02_quality_audit.ipynb và 03_data_cleaning.ipynb cũng cố ý không chạy trong
      # CI: chúng đọc data/interim/*.parquet, mà .gitignore loại bỏ và chỉ sinh được
      # sau khi chạy 01 (cần network). Thay vào đó, logic của 03 nằm hoàn toàn trong
      # src/cleaning.py và được kiểm thử offline đầy đủ bằng tests/test_cleaning.py,
      # vốn chạy ở job `validate` phía trên.
      #
      # 04_descriptive_stats.ipynb (Issue #8) CỐ TÌNH không chạy trong CI: nó cần
      # data/processed/air_pollution_final.parquet, cũng bị .gitignore loại bỏ.
      # Khả năng THỰC THI của nó vẫn được CI kiểm tra, nhưng trên dữ liệu TỔNG HỢP:
      # TestNotebookFixtureSmoke trong tests/test_validate_issue8.py (job `validate`)
      # dựng một fixture tất định (seed 42, 1.344 dòng, schema 18 cột canonical)
      # rồi chạy cả 37 cell trong thư mục tạm. Fixture đó chỉ chứng minh notebook
      # chạy được — KHÔNG chứng minh bất kỳ con số nào trong markdown hay CSV là
      # đúng. Việc đó chỉ kiểm được ở local với dataset thật.
      - name: Thực thi 00_environment_test.ipynb
        env:
          MPLBACKEND: Agg
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --output-dir /tmp/nbci \
            notebooks/00_environment_test.ipynb
      # Artifact M3 (Issue #8 + #9) được commit có chủ ý — .gitignore giữ ngoại lệ cho
      # reports/statistical_profile.csv và CỐ Ý KHÔNG chặn figures/. Bước này chỉ canh
      # "artifact còn nguyên và đúng hình dạng" (PNG giải mã được, đúng 300 DPI; CSV đúng
      # 8 dòng × 27 cột). Nó KHÔNG kiểm chứng bất kỳ con số khoa học nào trong đó: CI không
      # có data/, nên không thể. Việc đó chỉ kiểm được ở local với dataset thật.
      - name: Kiểm tra deliverable Milestone 3 (FIG + CSV)
        run: |
          python - <<'PY'
          import csv, pathlib, struct, sys

          EXPECTED_DPI, TOL = 300.0, 1.0
          failures = []

          for i in range(1, 8):
              path = pathlib.Path(f"figures/FIG-{i:02d}.png")
              if not path.is_file():
                  failures.append(f"{path}: missing")
                  continue
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  failures.append(f"{path}: not a PNG")
                  continue
              offset, dpi_x, dpi_y = 8, None, None
              while offset < len(data):
                  (length,) = struct.unpack(">I", data[offset:offset + 4])
                  ctype = data[offset + 4:offset + 8]
                  if ctype == b"pHYs":
                      ppu_x, ppu_y, _ = struct.unpack(">IIB", data[offset + 8:offset + 17])
                      dpi_x, dpi_y = ppu_x * 0.0254, ppu_y * 0.0254
                  if ctype == b"IEND":
                      break
                  offset += 12 + length
              if dpi_x is None:
                  failures.append(f"{path}: no pHYs chunk, DPI unknown")
              elif abs(dpi_x - EXPECTED_DPI) > TOL or abs(dpi_y - EXPECTED_DPI) > TOL:
                  failures.append(f"{path}: DPI {dpi_x:.2f}x{dpi_y:.2f} != {EXPECTED_DPI}")

          csv_path = pathlib.Path("reports/statistical_profile.csv")
          if not csv_path.is_file():
              failures.append(f"{csv_path}: missing")
          else:
              with csv_path.open(encoding="utf-8-sig", newline="") as fh:
                  rows = list(csv.reader(fh))
              if len(rows) != 9:
                  failures.append(f"{csv_path}: {len(rows)} lines, expected 1 header + 8 variables")
              elif any(len(r) != 27 for r in rows):
                  bad = [r[0] for r in rows if len(r) != 27]
                  failures.append(f"{csv_path}: rows not 27 columns: {bad}")

          if failures:
              print("M3 artifact check FAILED:", *failures, sep="\n  - ", file=sys.stderr)
              sys.exit(1)
          print("M3 artifacts OK: FIG-01..07 decodable @300 DPI, statistical_profile.csv 8x27")
          PY
