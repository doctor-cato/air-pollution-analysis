name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dừng ngay khi một job thất bại -> fail rõ ràng, không che giấu lỗi.
permissions:
  contents: read

jobs:
  validate:
    name: Python validation (unittest + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài dependencies từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Kiểm tra cú pháp Python (compileall)
        run: python -m compileall -q src tests scripts

      - name: Kiểm tra import sanity (không gọi network)
        run: |
          python -c "import src.data_collection"
          python -c "import src.data_quality"
          python -c "import src.cleaning"
          python -c "import src.cleaning_pipeline"

      # Chỉ chạy unit test. KHÔNG chạy run_collection_pipeline() vì cần
      # gọi OpenAQ S3 / Open-Meteo / AirNow qua mạng (không deterministic).
      - name: Chạy unit tests
        run: python -m unittest discover tests -v

      - name: Kiểm tra mọi notebook là JSON hợp lệ (không cần execute)
        # Rẻ hơn nhiều so với execute nhưng bắt được lỗi nghiêm trọng nhất từng
        # gặp: 03_transformation_pipeline.ipynb từng có hai chuỗi JSON nối vào
        # nhau khiến Jupyter KHÔNG MỞ ĐƯỢC file — và nó sống sót tới khi bị
        # review thủ công vì `notebook-smoke` chỉ chạy notebook 00.
        run: |
          python - <<'PY'
          import pathlib, sys
          import nbformat

          broken = []
          for path in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              try:
                  nbformat.read(path, as_version=4)
              except Exception as exc:
                  broken.append(f"{path}: {type(exc).__name__}: {exc}")
              else:
                  print(f"OK  {path}")
          if broken:
              print("\nNotebook KHÔNG đọc được:", file=sys.stderr)
              for line in broken:
                  print(f"  {line}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Kiểm tra khoảng trắng thừa trong diff (git diff --check)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA" 2>/dev/null || true
          BASE="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          if [ -n "$BASE" ] && [ "$BASE" != "$(git rev-parse HEAD)" ]; then
            git diff --check "$BASE" HEAD
          else
            echo "Không có commit cha so sánh được (đây là commit gốc hoặc push trực tiếp lên main) -> bỏ qua."
          fi

  notebook-smoke:
    name: Notebook smoke test (00_environment_test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài dependencies từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 00_environment_test.ipynb là deterministic hoàn toàn: chỉ import thư viện,
      # ghi/đọc Parquet tạm trong thư mục tạm, render Matplotlib. Không cần network,
      # không phụ thuộc file trong data/raw/ (data/raw/*.json bị .gitignore loại bỏ).
      #
      # 01_data_collection.ipynb CỐ TÌNH KHÔNG chạy trong CI: nó gọi
      # run_collection_pipeline() -> tải OpenAQ/Open-Meteo/AirNow từ Internet và
      # phụ thuộc dữ liệu thô không được commit. Bắt buộc chạy thủ công local.
      #
      # 02_quality_audit.ipynb và 03_data_cleaning.ipynb cũng cố ý không chạy trong
      # CI: chúng đọc data/interim/*.parquet, mà .gitignore loại bỏ và chỉ sinh được
      # sau khi chạy 01 (cần network). Thay vào đó, logic của 03 nằm hoàn toàn trong
      # src/cleaning.py và được kiểm thử offline đầy đủ bằng tests/test_cleaning.py,
      # vốn chạy ở job `validate` phía trên.
      - name: Thực thi 00_environment_test.ipynb
        env:
          MPLBACKEND: Agg
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --output-dir /tmp/nbci \
            notebooks/00_environment_test.ipynb
