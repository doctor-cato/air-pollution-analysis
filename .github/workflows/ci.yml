name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Dừng ngay khi một job thất bại -> fail rõ ràng, không che giấu lỗi.
permissions:
  contents: read

jobs:
  validate:
    name: Python validation (unittest + syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài dependencies từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Kiểm tra cú pháp Python (compileall)
        run: python -m compileall -q src tests scripts

      # Quét MỌI module trong src/ thay vì liệt kê tay: danh sách tay từng bị
      # bỏ quên khi thêm regression/classification/visualizer/... (Milestone 4).
      - name: Kiểm tra import sanity (không gọi network)
        run: |
          python - <<'PY'
          import importlib, pathlib
          for path in sorted(pathlib.Path("src").glob("*.py")):
              if path.stem != "__init__":
                  importlib.import_module(f"src.{path.stem}")
                  print(f"OK  src.{path.stem}")
          PY
          python -c "import importlib.util, pathlib; spec = importlib.util.spec_from_file_location('mc', 'scripts/validate_inference_montecarlo.py'); m = importlib.util.module_from_spec(spec); spec.loader.exec_module(m); print('monte-carlo script OK')"

      # Kiểm chứng Monte Carlo đầy đủ (1.000 lần × 9 kịch bản) là công việc
      # KHOA HỌC có chi phí (~nửa giờ) nên CỐ TÌNH không chạy trong CI. CI chỉ
      # kiểm hợp đồng của engine (TestMonteCarloValidation) với số lần rất nhỏ;
      # kết quả thật được commit ở reports/inference_montecarlo.csv.
      - name: Kiểm tra CSV kiểm chứng Monte Carlo đã commit
        run: |
          python - <<'PY'
          import pathlib, sys
          import pandas as pd

          path = pathlib.Path("reports/inference_montecarlo.csv")
          if not path.exists():
              print("Thiếu reports/inference_montecarlo.csv", file=sys.stderr)
              sys.exit(1)
          frame = pd.read_csv(path)
          assert len(frame) >= 30, f"CSV có {len(frame)} dòng — quá ít"
          assert "scenario" in frame.columns and "test" in frame.columns
          for column in frame.columns:
              if column.startswith("rate_"):
                  # Ô trống = phương pháp **không áp dụng** cho kịch bản đó
                  # (ví dụ cặp mùa hậu định không có đối chứng HAC) → bỏ qua,
                  # chỉ kiểm các tỷ lệ **có** mặt.
                  present = frame[column].dropna()
                  assert present.between(0, 1).all(), f"{column} ngoài [0, 1]"
          print(f"OK  {path} ({len(frame)} dòng, {frame['scenario'].nunique()} kịch bản)")
          PY

      # Chỉ chạy unit test. KHÔNG chạy run_collection_pipeline() vì cần
      # gọi OpenAQ S3 / Open-Meteo / AirNow qua mạng (không deterministic).
      - name: Chạy unit tests
        run: python -m unittest discover tests -v

      - name: Kiểm tra notebook (JSON hợp lệ, code cell compile, khớp generator)
        # (1) JSON: bắt lỗi nghiêm trọng nhất từng gặp — 03_transformation_pipeline.ipynb
        #     từng có hai chuỗi JSON nối vào nhau khiến Jupyter KHÔNG MỞ ĐƯỢC file.
        # (2) compile mọi code cell (magic IPython được chuyển thành Python trước):
        #     compileall ở trên KHÔNG quét được code nằm trong .ipynb.
        # (3) Generator là nguồn sự thật cho 04–07 (không sửa tay JSON notebook):
        #     từng cell của notebook trên đĩa phải khớp build_notebook_dict().
        # Notebook 05–07 KHÔNG được execute ở đây vì cần data/processed/*.parquet;
        # logic của chúng chạy end-to-end trên dữ liệu tổng hợp trong unit test
        # (TestRunInferenceSynthetic, test_regression, test_classification).
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          import nbformat
          from IPython.core.inputtransformer2 import TransformerManager

          failures = []
          tm = TransformerManager()

          for path in sorted(pathlib.Path("notebooks").glob("*.ipynb")):
              try:
                  nb = nbformat.read(path, as_version=4)
              except Exception as exc:
                  failures.append(f"{path}: {type(exc).__name__}: {exc}")
                  continue
              for i, cell in enumerate(nb.cells):
                  if cell.cell_type != "code":
                      continue
                  try:
                      compile(tm.transform_cell(cell.source), f"{path.name}#cell{i}", "exec")
                  except SyntaxError as exc:
                      failures.append(f"{path.name} cell {i}: {exc}")
              print(f"OK  {path}")

          def src(cell):
              s = cell["source"]
              return "".join(s) if isinstance(s, list) else s

          for num, name in (("04", "04_descriptive_stats"), ("05", "05_statistical_inference"),
                            ("06", "06_regression_modeling"), ("07", "07_classification_alerts")):
              spec = importlib.util.spec_from_file_location(
                  f"gen{num}", f"scripts/generate_{num}_notebook.py")
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              gen = mod.build_notebook_dict()["cells"]
              disk = nbformat.read(f"notebooks/{name}.ipynb", as_version=4).cells
              if len(gen) != len(disk):
                  failures.append(f"{name}: generator {len(gen)} cells != notebook {len(disk)} cells")
                  continue
              bad = [i for i, (g, d) in enumerate(zip(gen, disk))
                     if g["cell_type"] != d["cell_type"] or src(g) != src(d)]
              if bad:
                  failures.append(f"{name}: cell lệch generator {bad} — sửa generator rồi regenerate")
              else:
                  print(f"OK  {name} khớp generator ({len(gen)} cells)")

          if failures:
              print("Notebook check FAILED:", *failures, sep="\n  - ", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Kiểm tra khoảng trắng thừa trong diff (git diff --check)
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$GITHUB_SHA" 2>/dev/null || true
          BASE="$(git merge-base HEAD origin/main 2>/dev/null || true)"
          if [ -n "$BASE" ] && [ "$BASE" != "$(git rev-parse HEAD)" ]; then
            git diff --check "$BASE" HEAD
          else
            echo "Không có commit cha so sánh được (đây là commit gốc hoặc push trực tiếp lên main) -> bỏ qua."
          fi

  notebook-smoke:
    name: Notebook smoke test (00_environment_test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài dependencies từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # 00_environment_test.ipynb là deterministic hoàn toàn: chỉ import thư viện,
      # ghi/đọc Parquet tạm trong thư mục tạm, render Matplotlib. Không cần network,
      # không phụ thuộc file trong data/raw/ (data/raw/*.json bị .gitignore loại bỏ).
      #
      # 01_data_collection.ipynb CỐ TÌNH KHÔNG chạy trong CI: nó gọi
      # run_collection_pipeline() -> tải OpenAQ/Open-Meteo/AirNow từ Internet và
      # phụ thuộc dữ liệu thô không được commit. Bắt buộc chạy thủ công local.
      #
      # 02_quality_audit.ipynb và 03_data_cleaning.ipynb cũng cố ý không chạy trong
      # CI: chúng đọc data/interim/*.parquet, mà .gitignore loại bỏ và chỉ sinh được
      # sau khi chạy 01 (cần network). Thay vào đó, logic của 03 nằm hoàn toàn trong
      # src/cleaning.py và được kiểm thử offline đầy đủ bằng tests/test_cleaning.py,
      # vốn chạy ở job `validate` phía trên.
      #
      # 04_descriptive_stats.ipynb (Issue #8) CỐ TÌNH không chạy trong CI: nó cần
      # data/processed/air_pollution_final.parquet, cũng bị .gitignore loại bỏ.
      # Khả năng THỰC THI của nó vẫn được CI kiểm tra, nhưng trên dữ liệu TỔNG HỢP:
      # TestNotebookFixtureSmoke trong tests/test_validate_issue8.py (job `validate`)
      # dựng một fixture tất định (seed 42, 1.344 dòng, schema 18 cột canonical)
      # rồi chạy cả 37 cell trong thư mục tạm. Fixture đó chỉ chứng minh notebook
      # chạy được — KHÔNG chứng minh bất kỳ con số nào trong markdown hay CSV là
      # đúng. Việc đó chỉ kiểm được ở local với dataset thật.
      - name: Thực thi 00_environment_test.ipynb
        env:
          MPLBACKEND: Agg
        run: |
          python -m jupyter nbconvert \
            --to notebook \
            --execute \
            --output-dir /tmp/nbci \
            notebooks/00_environment_test.ipynb
      # Artifact M3 + M4 được commit có chủ ý — .gitignore giữ ngoại lệ cho reports/
      # và CỐ Ý KHÔNG chặn figures/. Bước này chỉ canh "artifact còn nguyên và đúng hình
      # dạng": danh sách hình BẮT BUỘC còn đủ, MỌI PNG trong figures/ đúng 300 DPI (kể cả
      # hình mới chưa vào danh sách), báo cáo W9/W10/W11 không rỗng, CSV đúng 8 × 27.
      # Nó KHÔNG kiểm chứng bất kỳ con số khoa học nào trong đó: CI không có data/, nên
      # không thể. Việc đó chỉ kiểm được ở local với dataset thật.
      - name: Kiểm tra deliverable Milestone 3 + 4 (FIG + báo cáo + CSV)
        run: |
          python - <<'PY'
          import csv, pathlib, struct, sys

          EXPECTED_DPI, TOL = 300.0, 1.0
          failures = []

          REQUIRED_FIGURES = (
              [f"figures/FIG-{i:02d}.png" for i in range(1, 13)]           # M3 #9 + W9 #11
              + ["figures/FIG-01-extended-historical.png"]                   # Issue #44
              + [f"figures/extended/{n}.png" for n in (                      # Issue #50
                  "FIG-02-extended", "FIG-03-extended", "FIG-03b-winter-coverage")]
              + [f"figures/{stem}{sfx}.png"                                  # W10 #12, W11 #13
                 for stem in ("regression_line_diagnostics", "precision_recall_curve",
                              "feature_importance")
                 for sfx in ("", "_vn001_extended", "_vn003_extended")]
          )
          REQUIRED_TEXT = [
              "reports/inference_results.md", "reports/regression_results.md",
              "reports/classification_results.md", "reports/classification_leakage_audit.md",
              "reports/extended_reanalysis_comparison.md",
              "docs/regression_findings.md", "docs/classification_findings.md",
              "docs/leakage_audit.md",
          ]

          def png_dpi(path):
              data = path.read_bytes()
              if data[:8] != b"\x89PNG\r\n\x1a\n":
                  return "not a PNG"
              offset = 8
              while offset < len(data):
                  (length,) = struct.unpack(">I", data[offset:offset + 4])
                  ctype = data[offset + 4:offset + 8]
                  if ctype == b"pHYs":
                      ppu_x, ppu_y, _ = struct.unpack(">IIB", data[offset + 8:offset + 17])
                      return ppu_x * 0.0254, ppu_y * 0.0254
                  if ctype == b"IEND":
                      break
                  offset += 12 + length
              return "no pHYs chunk, DPI unknown"

          for rel in REQUIRED_FIGURES:
              if not pathlib.Path(rel).is_file():
                  failures.append(f"{rel}: missing")

          pngs = sorted(pathlib.Path("figures").rglob("*.png"))
          for path in pngs:
              dpi = png_dpi(path)
              if isinstance(dpi, str):
                  failures.append(f"{path.as_posix()}: {dpi}")
              elif abs(dpi[0] - EXPECTED_DPI) > TOL or abs(dpi[1] - EXPECTED_DPI) > TOL:
                  failures.append(f"{path.as_posix()}: DPI {dpi[0]:.2f}x{dpi[1]:.2f} != {EXPECTED_DPI}")

          for rel in REQUIRED_TEXT:
              path = pathlib.Path(rel)
              if not path.is_file():
                  failures.append(f"{rel}: missing")
              elif not path.read_text(encoding="utf-8").strip():
                  failures.append(f"{rel}: empty")

          csv_path = pathlib.Path("reports/statistical_profile.csv")
          if not csv_path.is_file():
              failures.append(f"{csv_path}: missing")
          else:
              with csv_path.open(encoding="utf-8-sig", newline="") as fh:
                  rows = list(csv.reader(fh))
              if len(rows) != 9:
                  failures.append(f"{csv_path}: {len(rows)} lines, expected 1 header + 8 variables")
              elif any(len(r) != 27 for r in rows):
                  bad = [r[0] for r in rows if len(r) != 27]
                  failures.append(f"{csv_path}: rows not 27 columns: {bad}")

          if failures:
              print("Artifact check FAILED:", *failures, sep="\n  - ", file=sys.stderr)
              sys.exit(1)
          print(f"Artifacts OK: {len(pngs)} PNG @300 DPI ({len(REQUIRED_FIGURES)} bắt buộc), "
                f"{len(REQUIRED_TEXT)} báo cáo không rỗng, statistical_profile.csv 8x27")
          PY

  # Bất biến dấu phân cách đường dẫn Windows chỉ tồn tại trên Windows: 2 test trong
  # tests/test_pipeline_runtime_log.py có skipUnless(os.name == "nt") nên LUÔN skip ở
  # job `validate` (ubuntu). Job này chạy riêng module đó trên Windows để chúng thực
  # sự được kiểm — không chạy cả suite (tốn gấp đôi thời gian CI cho lợi ích nhỏ).
  windows-paths:
    name: Windows path invariants (test_pipeline_runtime_log)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cài dependencies từ requirements.txt
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Chạy test_pipeline_runtime_log trên Windows
        run: python -m unittest tests.test_pipeline_runtime_log -v
